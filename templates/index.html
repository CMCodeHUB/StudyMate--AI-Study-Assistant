<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<meta name="theme-color" content="#ffffff" />
<title>StudyMate</title>

<!-- Apply saved / system theme before first paint to avoid a flash -->
<script>
  (function () {
    try {
      var saved = localStorage.getItem("studymate-theme");
      var theme = saved || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    } catch (e) {}
  })();
</script>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js" defer></script>
<script src="{{ url_for('static', filename='script.js') }}" defer></script>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-sidebar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M9.5 4v16" stroke="currentColor" stroke-width="1.7"/></symbol>
    <symbol id="i-compose" viewBox="0 0 24 24"><path d="M12 20h9" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M5 15V6.5A2.5 2.5 0 0 1 7.5 4H15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
    <symbol id="i-logout" viewBox="0 0 24 24"><path d="M9 4H6.5A2.5 2.5 0 0 0 4 6.5v11A2.5 2.5 0 0 0 6.5 20H9" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M15 8l4 4-4 4M19 12H9" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9L12 3z" fill="currentColor"/></symbol>
  </defs>
</svg>

<div class="app sidebar-open" id="app">
  <div class="overlay" id="overlay" hidden></div>

  <!-- ─────────── Sidebar ─────────── -->
  <aside class="sidebar" id="sidebar" aria-label="Sidebar">
    <div class="sidebar-head">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><svg class="icon"><use href="#i-spark"/></svg></span>
        <span class="brand-name">StudyMate</span>
      </div>
      <button class="icon-btn" id="close-sidebar" type="button" aria-label="Close sidebar" title="Close sidebar">
        <svg class="icon"><use href="#i-sidebar"/></svg>
      </button>
    </div>

    <button class="new-chat" id="new-chat" type="button">
      <svg class="icon"><use href="#i-compose"/></svg>
      <span>New chat</span>
    </button>

    <section class="tasks" aria-labelledby="tasks-title">
      <h2 id="tasks-title">Study tasks</h2>

      <form id="task-form" class="task-form" autocomplete="off">
        <input id="task-input" type="text" placeholder="Add a task" maxlength="120" aria-label="New task" />
        <button type="submit" aria-label="Add task" title="Add task"><svg class="icon"><use href="#i-plus"/></svg></button>
      </form>

      <ul id="task-list" class="task-list" aria-live="polite"></ul>
      <p id="task-empty" class="task-empty" hidden>No tasks yet. Add one here, or ask StudyMate in chat.</p>
    </section>
    <div class="account">
      <div class="account-row">
        <span class="account-avatar" aria-hidden="true">{{ user.name[0]|upper }}</span>
        <span class="account-info">
          <span class="account-name">{{ user.name }}</span>
          <span class="account-email">{{ user.email }}</span>
        </span>
      </div>
      <form method="post" action="{{ url_for('logout') }}">
        <button type="submit" class="logout-btn">
          <svg class="icon" aria-hidden="true"><use href="#i-logout"/></svg>
          <span>Log out</span>
        </button>
      </form>
    </div>
  </aside>

  <!-- ─────────── Main ─────────── -->
  <main class="main is-empty" id="main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="icon-btn" id="open-sidebar" type="button" aria-label="Open sidebar" title="Open sidebar">
          <svg class="icon"><use href="#i-sidebar"/></svg>
        </button>
        <span class="model-name">StudyMate</span>
      </div>
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="Switch to dark theme" title="Toggle theme">
        <svg class="icon icon-sun"><use href="#i-sun"/></svg>
        <svg class="icon icon-moon"><use href="#i-moon"/></svg>
      </button>
    </header>

    <div class="scroll" id="scroll">
      <div class="thread">
        <div class="empty-state" id="empty-state">
          <h1>What are you studying today?</h1>
          <div class="chips" id="chips">
            <button type="button" class="chip" data-prompt="What is polymorphism?"><strong>Explain a concept</strong><span>What is polymorphism?</span></button>
            <button type="button" class="chip" data-prompt="What's the time complexity of a hash map lookup?"><strong>Check complexity</strong><span>Hash map lookup time</span></button>
            <button type="button" class="chip" data-prompt="Add a task to revise linked lists"><strong>Plan your revision</strong><span>Add a task to revise linked lists</span></button>
            <button type="button" class="chip" data-prompt="List my tasks"><strong>Review progress</strong><span>List my tasks</span></button>
          </div>
        </div>
        <div class="messages" id="messages"></div>
      </div>
    </div>

    <div class="composer-wrap">
      <form id="chat-form" class="composer" autocomplete="off">
        <textarea id="chat-input" rows="1" placeholder="Ask about your notes, or add a task" aria-label="Message StudyMate" maxlength="4000"></textarea>
        <button type="submit" id="send-btn" class="send-btn" aria-label="Send message" title="Send message" disabled>
          <svg class="icon"><use href="#i-send"/></svg>
        </button>
      </form>
      <p class="disclaimer">StudyMate can make mistakes. Check important information.</p>
    </div>
  </main>
</div>

</body>
</html>
